name: Package

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke-test installed CLI
        shell: bash
        run: |
          codebase-index --version
          codebase-index --help
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/example.py" <<'PY'
          """Tiny package smoke test."""

          class Example:
              def greet(self, name: str = "world") -> str:
                  return f"Hello, {name}"
          PY
          (
            cd "$tmpdir"
            codebase-index .
            test -f codebase-index/index.json
            test -f codebase-index/tree.txt
          )
